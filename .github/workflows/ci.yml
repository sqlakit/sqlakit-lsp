name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: '1'

jobs:
  tests:
    name: Tests on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Lint
        if: matrix.python == '3.11'
        run: uv run poe lint
      - name: Run tests
        run: uv run pytest
      # The lock holds the newest `sqlakit`, and the server still reads the oldest.
      - name: Run tests on the oldest sqlakit
        if: matrix.python == '3.11'
        run: uv run --with 'sqlakit==0.21.0' pytest
